name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Set up native secret scanner and hooks
        run: bun run setup:security
      - name: Scan fetched history
        run: bun run secrets:history
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run check
      - name: Verify policy commands
        run: bun run test:policy
      - name: Verify hook and secret-scan behavior
        run: bun run test:security
      - name: Run unit tests
        run: bun run test:unit
      - name: Build static site
        run: bun run build
      - name: Check emitted installation assets
        run: bun run check:assets
      - name: Install WebKit for end-to-end tests
        run: bunx --no-install playwright install --with-deps webkit
      - name: Build a newer version for the update test
        run: bun run build:next
      - name: Run end-to-end tests
        run: bun run test:e2e
