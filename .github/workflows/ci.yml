name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Set up native secret scanner and hooks
        run: bun run setup:security
      - name: Scan fetched history
        run: bun run secrets:history
      - name: Scan staged changes
        run: bun run secrets:staged
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run check
      - name: Verify policy commands
        run: bun run test:policy
      - name: Verify hook and secret-scan behavior
        run: bun run test:security
      - name: Build static site
        run: bun run build
      - name: Check emitted installation assets
        run: bun run check:assets
