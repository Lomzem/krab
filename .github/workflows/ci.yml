name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Set up native secret scanner and hooks
        run: bun run setup:security
      - name: Scan fetched history
        run: bun run secrets:history
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run check
      - name: Run unit tests
        run: bun run test:unit
      - name: Build static site
        run: bun run build
      - name: Check emitted installation assets
        run: bun run check:assets

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify policy commands
        run: bun run test:policy

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Set up native secret scanner and hooks
        run: bun run setup:security
      - name: Verify hook and secret-scan behavior
        run: bun run test:security

  browser:
    name: ${{ matrix.script }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { script: test:e2e, shard: 1/6 }
          - { script: test:e2e, shard: 2/6 }
          - { script: test:e2e, shard: 3/6 }
          - { script: test:e2e, shard: 4/6 }
          - { script: test:e2e, shard: 5/6 }
          - { script: test:e2e, shard: 6/6 }
          - { script: test:recipes, shard: 1/4 }
          - { script: test:recipes, shard: 2/4 }
          - { script: test:recipes, shard: 3/4 }
          - { script: test:recipes, shard: 4/4 }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Bun
        run: npm install --global --no-fund --no-audit "$(node -p "require('./package.json').packageManager")"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build static site
        run: bun run build
      - name: Build a newer version for the update test
        if: matrix.script == 'test:e2e'
        run: bun run build:next
      - name: Run browser tests
        run: bun run ${{ matrix.script }} --shard ${{ matrix.shard }}
